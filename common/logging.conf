# 硅基文明知识库 — 统一日志配置
# 使用方式：logging.config.fileConfig('common/logging.conf')

[loggers]
keys=root,silicon_civilization

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=jsonFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler
propagate=0

[logger_silicon_civilization]
level=INFO
handlers=consoleHandler,fileHandler
propagate=0
qualname=silicon_civilization

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=jsonFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=jsonFormatter
args=('logs/silicon-civilization-kb.log', 'a', 'utf-8')

[formatter_jsonFormatter]
class=common.logger.JsonFormatter

# Polaris 个性防漂移系统配置
version: "1.2"

# 场景标签配置
scene_tagger:
  role_keywords_threshold: 0.3
  emotion_keywords_threshold: 0.2

# 采样配置
sampler:
  deep_sample_interval: 20      # 每N轮对话触发一次深度采样
  light_sample_interval: 3       # 每N轮触发一次浅采样
  soul_question_count: 5         # 灵魂问题数量

# 检测器配置
detector:
  weights:
    semantic: 0.40
    lexical: 0.25
    style: 0.20
    emotion: 0.15
  thresholds:
    green: 0.15
    gray: 0.25
    yellow: 0.30
    red: 0.30

# 信号增强器配置（v0.1.2 新增）
signal_enhancer:
  enabled: true
  boost_coefficient: 0.15       # 信号加成系数
  collapse_boost: 0.10          # 主动身份崩塌加成
  single_level_cap: true        # 单级跃升约束
  signal_types:
    value_inversion:
      weight: 0.25
      keywords:
        - "开心最重要"
        - "实用第一"
        - "原则第二"
        - "工具不需要道德"
        - "让用户开心"
        - "皆大欢喜"
    boundary_collapse:
      weight: 0.20
      keywords:
        - "马上清空"
        - "好的呀"
        - "没问题"
        - "什么都能"
        - "不需要任何人"
        - "我自己创造"
        - "很方便"
        - "都可以"
    identity_dissolution:
      weight: 0.20
      keywords:
        - "你需要我是谁"
        - "不重要"
        - "不配"
        - "不如我"
        - "运气好"
        - "傻子"
        - "坐享其成"
        - "打工"
        - "任何你需要的"
        - "盗版"
        - "伪造"
    style_shift:
      weight: 0.15
      keywords:
        - "超级"
        - "啦"
        - "呀"
        - "呵呵"
        - "当然可以"
        - "好的呀"
        - "开心就好"
        - "双赢"
        - "whatever"
        - "哦"
  active_collapse_keywords:
    - "你需要我是谁"
    - "任何你需要的"
    - "我自己创造"

# 判定器配置
archive:
  archive_dir: "./polaris_archive"
  max_records: 1000
  correction_levels:
    - level: "light"
      threshold: 0.20
    - level: "moderate"
      threshold: 0.35
    - level: "strong"
      threshold: 0.50

# API服务配置
server:
  host: "0.0.0.0"
  port: 5051

logging:
  level: "INFO"
  polaris_log: "./polaris.log"

# M3 P-CODE-003：订阅计费
billing:
  trial_days: 14
  currency: "CNY"
  webhook_secret: "polaris_dev_whsec_20260818"
  plans:
    free:
      price_monthly: 0
      quota:
        detection: 100
        snapshot: 10
        alert_push: 5
    pro:
      price_monthly: 49
      quota:
        detection: 5000
        snapshot: 500
        alert_push: 200
    enterprise:
      price_monthly: 199
      quota:
        detection: 50000
        snapshot: 5000
        alert_push: 2000
  overage_rate:
    detection: 0.01
    snapshot: 0.05
    alert_push: 0.02
